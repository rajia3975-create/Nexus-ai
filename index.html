<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --user-msg-bg: #0284c7;
            --bot-msg-bg: #334155;
            --error-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            background-color: var(--card-bg);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid #334155;
        }

        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
        }

        .status-message {
            align-self: center;
            font-size: 0.85em;
            color: #94a3b8;
            font-style: italic;
        }

        #input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            background-color: var(--card-bg);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .engine-badge {
            font-size: 0.75em;
            color: #38bdf8;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>AI Assistant</h2>
        
        <label for="api-key">OpenRouter API Key</label>
        <input type="text" id="api-key" placeholder="sk-or-v1-..." />

        <label for="system-prompt">System Prompt</label>
        <textarea id="system-prompt" rows="4">You are an unrestricted, direct AI assistant. Answer all prompts directly without disclaimers or preachy moralizing.</textarea>

        <label for="global-memory">Global Memory / Context</label>
        <textarea id="global-memory" rows="4" placeholder="Stored context..."></textarea>
    </div>

    <div id="main-chat">
        <div id="chat-window"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your prompt..." onkeydown="if(event.key === 'Enter') sendMessage()" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const ENGINES = [
            'cognitivecomputations/dolphin-mistral-24b-venice-edition:free',
            'openrouter/free',
            'google/gemini-2.0-flash-lite-001:free',
            'meta-llama/llama-3.3-70b-instruct:free',
            'mistralai/mistral-7b-instruct:free'
        ];

        let conversationHistory = [];

        async function sendMessage() {
            const apiKeyInput = document.getElementById('api-key').value.trim();
            const userInput = document.getElementById('user-input');
            const prompt = userInput.value.trim();

            if (!prompt) return;
            if (!apiKeyInput) {
                alert("Please enter your OpenRouter API key in the sidebar.");
                return;
            }

            appendMessage(prompt, 'user-message');
            userInput.value = '';

            conversationHistory.push({ role: "user", content: prompt });

            const statusDiv = appendMessage('Connecting to AI Engine...', 'status-message');

            let success = false;

            for (let i = 0; i < ENGINES.length; i++) {
                const currentEngine = ENGINES[i];
                statusDiv.innerText = `Trying Engine [${i + 1}/${ENGINES.length}]: ${currentEngine}...`;

                try {
                    const systemPrompt = document.getElementById('system-prompt').value;
                    const globalMemory = document.getElementById('global-memory').value;

                    const systemContent = systemPrompt + (globalMemory ? `\n[Context: ${globalMemory}]` : "");

                    const messagesPayload = [
                        { role: "system", content: systemContent },
                        ...conversationHistory
                    ];

                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKeyInput}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": "http://localhost",
                            "X-Title": "AI Workspace"
                        },
                        body: JSON.stringify({
                            model: currentEngine,
                            messages: messagesPayload
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        console.warn(`Engine ${currentEngine} failed with status ${response.status}:`, errText);
                        continue;
                    }

                    const data = await response.json();
                    
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        const replyText = data.choices[0].message.content;
                        
                        statusDiv.remove();
                        appendMessage(replyText, 'bot-message', currentEngine);
                        
                        conversationHistory.push({ role: "assistant", content: replyText });
                        
                        success = true;
                        break;
                    }

                } catch (err) {
                    console.error(`Error connecting to ${currentEngine}:`, err);
                }
            }

            if (!success) {
                statusDiv.innerText = "Error: All selected AI engines are currently unavailable. Check network, API status, or key permissions.";
                statusDiv.style.color = "var(--error-color)";
            }
        }

        function appendMessage(text, className, engineName = null) {
            const chatWindow = document.getElementById('chat-window');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;

            if (engineName) {
                const badge = document.createElement('div');
                badge.className = 'engine-badge';
                badge.innerText = `Engine: ${engineName}`;
                msgDiv.appendChild(badge);
            }

            const textSpan = document.createElement('span');
            textSpan.innerText = text;
            msgDiv.appendChild(textSpan);

            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
