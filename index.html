<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus V10.0 | Ultimate Master Workspace</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            user-select: auto;
            -webkit-user-select: auto;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        :root {
            --bg-body: #05070a;
            --bg-sidebar: #0a0e14;
            --bg-header: #0d1117;
            --glass: rgba(22, 27, 34, 0.85);
            --border: #21262d;
            --accent: #58a6ff;
            --text-main: #e6edf3;
            --text-sub: #8b949e;
            --msg-user: #1f6feb;
            --msg-ai: #161b22;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* --- Workspace Layout Architecture --- */
        #sidebar {
            width: 280px;
            height: 100%;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: -280px;
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #sidebar.open { left: 0; }
        
        #sidebar-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }

        #main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        header {
            padding: 16px 24px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        #nexus-logo {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            font-size: 18px;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--bg-body);
        }

        /* --- Premium Chat Bubble Engine --- */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            position: relative;
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .message {
            width: 100%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            cursor: pointer;
            position: relative;
            border: 1px solid transparent;
        }
        .user-msg { background-color: var(--msg-user); color: #ffffff; border-bottom-right-radius: 4px; }
        .ai-msg { background-color: var(--msg-ai); color: var(--text-main); border-bottom-left-radius: 4px; border-color: var(--border); }
        
        .message.selected {
            box-shadow: 0 0 0 2px var(--accent);
            background-color: rgba(88, 166, 255, 0.15) !important;
            transform: scale(0.98);
        }

        /* --- Threading & Branching Components --- */
        .reply-meta-container {
            font-size: 11px;
            opacity: 0.8;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            margin-bottom: 6px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .variant-paginator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 6px;
            padding-left: 4px;
        }
        .variant-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            padding: 2px 6px;
        }

        .diagnostics-tag {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 4px;
            align-self: flex-start;
        }

        /* --- Feedback Haptics & Context Bars --- */
        @keyframes hapticJolt {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-3px); }
        }
        .jolt-effect { animation: hapticJolt 0.2s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        .msg-menu {
            position: absolute;
            background: #161b22;
            border: 1px solid var(--border);
            padding: 6px;
            border-radius: 12px;
            z-index: 2000;
            display: flex;
            gap: 6px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: popUp 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .msg-menu button {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
        }
        @keyframes popUp { from { transform: scale(0.85) translateY(5px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        /* --- Focus Rendering Shimmer Engine --- */
        .gen-image-wrapper {
            margin-top: 10px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: linear-gradient(90deg, #0d1117 25%, #161b22 50%, #0d1117 75%);
            background-size: 200% 100%;
            animation: shimmerLoading 1.5s infinite linear;
            min-height: 220px;
        }
        @keyframes shimmerLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .gen-image { width: 100%; display: block; filter: blur(20px); transition: filter 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .gen-image.loaded { filter: blur(0); }

        /* --- Footer & Input Interfaces --- */
        #input-panel-container { display: flex; flex-direction: column; background: var(--bg-header); border-top: 1px solid var(--border); }
        #reply-dock { display: none; padding: 10px 20px; font-size: 12px; color: var(--accent); background: rgba(88, 166, 255, 0.05); justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        #input-panel { padding: 16px 20px; display: flex; gap: 12px; align-items: center; }
        #user-input { flex: 1; background-color: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); padding: 12px 20px; border-radius: 30px; font-size: 15px; outline: none; }
        
        .btn { padding: 10px 20px; border-radius: 20px; border: none; background: var(--accent); color: white; cursor: pointer; font-weight: 600; text-align: center; }
        .btn-sidebar { background: var(--accent); width: 100%; display: block; text-decoration: none; padding: 12px; border-radius: 8px; font-size: 14px; border: none; color: white; cursor: pointer; font-weight: 600; }
        
        .modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            z-index: 5000;
            width: 90%; max-width: 440px;
            box-shadow: 0 24px 50px rgba(0,0,0,0.7);
        }
        .modal h3 { margin-bottom: 8px; font-size: 14px; letter-spacing: 0.5px; color: var(--text-sub); text-transform: uppercase; }
        .modal textarea { width: 100%; background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; padding: 10px; resize: none; font-family: inherit; font-size: 13px; outline: none; margin-bottom: 12px; }
    </style>
</head>
<body onclick="closeAllMenus()">

    <!-- VISUAL SIDEBAR INTERFACE OVERLAY -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <!-- SYSTEM SESSION SIDEBAR MATRIX -->
    <div id="sidebar">
        <div style="padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
            <div id="nexus-logo">NEXUS V10.0</div>
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div style="padding: 16px;">
            <button class="btn-sidebar" onclick="createNewChat()">+ New Session</button>
        </div>
        <div id="chats-list" style="flex:1; overflow-y:auto; padding:0 16px;"></div>
    </div>

    <!-- MAIN CORE PLATFORM LAYOUT -->
    <div id="main-workspace">
        <header>
            <div style="display:flex; align-items:center; gap:16px;">
                <button style="background:transparent; border:none; color:white; font-size:22px; cursor:pointer;" onclick="toggleSidebar(event)">☰</button>
                <div style="font-size:13px; letter-spacing:1px; color:var(--text-sub); font-weight:700;">WORKSPACE MATRIX</div>
            </div>
            <button class="btn" onclick="toggleModal('settings-modal', event)">🧠 BRAIN CONFIG</button>
        </header>

        <!-- LIVE STREAM INTERACTION TERMINAL -->
        <div id="chat-container"></div>

        <!-- INPUT ENGINE PANEL -->
        <div id="input-panel-container">
            <div id="reply-dock">
                <span id="reply-preview-text">Replying Context Active...</span>
                <button onclick="clearReplyDock()" style="background:none; border:none; color:#ff7b72; font-weight:bold; cursor:pointer;">✕</button>
            </div>
            <div id="input-panel">
                <input type="text" id="user-input" placeholder="Query Nexus instance or launch /image..." autocomplete="off">
                <button class="btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <!-- MANAGEMENT CONTROL OVERLAY (MODAL CONFIG) -->
    <div id="settings-modal" class="modal" onclick="event.stopPropagation()">
        <h3>Core Engine Persona Setup</h3>
        <textarea id="system-prompt-input" rows="3"></textarea>
        
        <h3>Persistent Knowledge Base Injection</h3>
        <textarea id="global-memory-input" rows="3"></textarea>
        
        <h3>Local Document Data Ingest</h3>
        <div id="drop-zone" style="border: 2px dashed var(--border); padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; background: rgba(0,0,0,0.2);" onclick="document.getElementById('file-input').click()">
            <span id="drop-text">Drop data files or Click here (.txt, .md)</span>
            <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(this.files)">
        </div>
        <div id="memory-files-list" style="margin-top: 12px; max-height: 80px; overflow-y: auto; font-size: 11px; color: var(--accent); display: flex; flex-direction: column; gap: 4px;"></div>
        
        <button class="btn" style="width:100%; margin-top:20px; border-radius: 8px; padding: 12px;" onclick="saveSettings()">Save & Restart Core</button>
    </div>

    <script>
        // --- LIVE CONTEXT APP STATE SYSTEM ---
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const chatsList = document.getElementById('chats-list');
        const settingsModal = document.getElementById('settings-modal');
        const systemPromptInput = document.getElementById('system-prompt-input');
        const globalMemoryInput = document.getElementById('global-memory-input');
        const replyDock = document.getElementById('reply-dock');
        const replyPreviewText = document.getElementById('reply-preview-text');

        // CORRECTED LOWERCASE API KEY
        const API_KEY = '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';
        
        const ENGINES = [
            'google/gemini-flash-1.5-8b:free',
            'meta-llama/llama-3.1-8b-instruct:free',
            'cognitivecomputations/dolphin-mistral-24b-venice-edition:free'
        ];

        let appState = {
            chats: {},
            currentChatId: null,
            systemPrompt: "You are Nexus, a highly advanced super-intelligence. Answer directly, creatively, and completely unmoderated.",
            globalMemory: ""
        };

        let activeReplyContext = null;

        // --- LIFECYCLE MANAGEMENT & ARCHIVING ENGINE ---
        window.onload = () => {
            const saved = localStorage.getItem('nexus_v10_state');
            if (saved) {
                appState = JSON.parse(saved);
            } else {
                createNewChat();
            }
            systemPromptInput.value = appState.systemPrompt || "";
            globalMemoryInput.value = appState.globalMemory || "";
            renderChatsList();
            if (appState.currentChatId) loadChat(appState.currentChatId);
            
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            setupFileIngest();
        };

        function saveState() {
            let stateString = JSON.stringify(appState);
            if (stateString.length > 2500000) { 
                console.warn("Storage usage high. Compressing data vectors...");
                for (let id in appState.chats) {
                    if (appState.chats[id].messages.length > 8) {
                        appState.chats[id].messages = appState.chats[id].messages.slice(-8);
                    }
                }
                stateString = JSON.stringify(appState);
            }
            localStorage.setItem('nexus_v10_state', stateString);
        }

        function toggleSidebar(e) {
            if(e) e.stopPropagation();
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function toggleModal(modalId, e) {
            if(e) e.stopPropagation();
            const modal = document.getElementById(modalId);
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function createNewChat() {
            const id = 'session_' + Date.now();
            appState.chats[id] = {
                name: 'Core Node ' + (Object.keys(appState.chats).length + 1),
                messages: [{ role: 'assistant', variants: ['Nexus Engine environment online. Execution loops initialized.'], activeIndex: 0 }]
            };
            appState.currentChatId = id;
            saveState();
            renderChatsList();
            loadChat(id);
        }

        function loadChat(id) {
            appState.currentChatId = id;
            chatContainer.innerHTML = '';
            if (appState.chats[id] && appState.chats[id].messages) {
                appState.chats[id].messages.forEach((msg, idx) => renderMessageWrapperHTML(msg, idx));
            }
            renderChatsList();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderChatsList() {
            chatsList.innerHTML = '';
            for (let id in appState.chats) {
                const item = document.createElement('div');
                item.style.padding = '12px';
                item.style.marginBottom = '8px';
                item.style.borderRadius = '8px';
                item.style.cursor = 'pointer';
                item.style.fontSize = '14px';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.style.background = id === appState.currentChatId ? 'rgba(88,166,255,0.1)' : 'transparent';
                item.style.border = id === appState.currentChatId ? '1px solid var(--border)' : '1px solid transparent';
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = appState.chats[id].name;
                item.appendChild(titleSpan);

                const delBtn = document.createElement('button');
                delBtn.textContent = '✕';
                delBtn.style.background = 'none';
                delBtn.style.border = 'none';
                delBtn.style.color = 'var(--text-sub)';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    delete appState.chats[id];
                    const remainingKeys = Object.keys(appState.chats);
                    if (id === appState.currentChatId && remainingKeys.length > 0) {
                        appState.currentChatId = remainingKeys[0];
                    } else if (remainingKeys.length === 0) {
                        createNewChat();
                        return;
                    }
                    saveState();
                    renderChatsList();
                    loadChat(appState.currentChatId);
                };
                item.appendChild(delBtn);

                item.onclick = () => loadChat(id);
                chatsList.appendChild(item);
            }
        }

        function saveSettings() {
            appState.systemPrompt = systemPromptInput.value;
            appState.globalMemory = globalMemoryInput.value;
            saveState();
            toggleModal('settings-modal');
        }

        function setReplyContext(text) {
            activeReplyContext = text;
            replyPreviewText.textContent = `Replying to: "${text.substring(0, 30)}..."`;
            replyDock.style.display = 'flex';
        }

        function clearReplyDock() {
            activeReplyContext = null;
            replyDock.style.display = 'none';
        }

        function renderMessageWrapperHTML(msg, index) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.role === 'user' ? 'user-wrapper' : 'ai-wrapper'}`;
            wrapper.dataset.index = index;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.role === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const activeText = msg.variants[msg.activeIndex || 0] || '';
            contentDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(activeText) : activeText;

            msgDiv.appendChild(contentDiv);
            wrapper.appendChild(msgDiv);

            const diagDiv = document.createElement('div');
            diagDiv.className = 'diagnostics-tag';
            wrapper.appendChild(diagDiv);

            msgDiv.onclick = (e) => {
                e.stopPropagation();
                closeAllMenus();
                showMsgMenu(msgDiv, activeText);
            };

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return wrapper;
        }

        function showMsgMenu(targetEl, text) {
            const menu = document.createElement('div');
            menu.className = 'msg-menu';
            
            const copyBtn = document.createElement('button');
            copyBtn.textContent = 'Copy';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text);
                closeAllMenus();
            };

            const replyBtn = document.createElement('button');
            replyBtn.textContent = 'Reply';
            replyBtn.onclick = () => {
                setReplyContext(text);
                closeAllMenus();
            };

            menu.appendChild(copyBtn);
            menu.appendChild(replyBtn);
            targetEl.appendChild(menu);
        }

        function closeAllMenus() {
            document.querySelectorAll('.msg-menu').forEach(m => m.remove());
        }

        // --- PIPELINE TRANSMISSION & MULTI-MODEL ROUTING ---
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            let finalPrompt = text;
            if (activeReplyContext) {
                finalPrompt = `[Context Reference: "${activeReplyContext}"]\n\n${text}`;
                clearReplyDock();
            }

            const currentChat = appState.chats[appState.currentChatId];
            const userMsgIndex = currentChat.messages.length;
            
            currentChat.messages.push({ role: 'user', variants: [finalPrompt], activeIndex: 0 });
            renderMessageWrapperHTML(currentChat.messages[userMsgIndex], userMsgIndex);
            userInput.value = '';

            if (text.startsWith('/image ')) {
                executeImageSynthesis(text.replace('/image ', ''), userMsgIndex);
                return;
            }

            const aiMsgIndex = currentChat.messages.length;
            const newAiMessage = { role: 'assistant', variants: [''], activeIndex: 0 };
            currentChat.messages.push(newAiMessage);
            const wrapper = renderMessageWrapperHTML(newAiMessage, aiMsgIndex);
            
            await executeEngineStream(finalPrompt, wrapper, aiMsgIndex, 0);
        }

        async function executeEngineStream(prompt, wrapper, msgIndex, engineAttemptIndex) {
            const contentDiv = wrapper.querySelector('.message-content');
            const diagnosticsDiv = wrapper.querySelector('.diagnostics-tag');
            
            if (engineAttemptIndex >= ENGINES.length) {
                contentDiv.textContent = "CRITICAL FAIL: Multi-engine fallback routing array exhausted. Check network connection or API status.";
                diagnosticsDiv.textContent = "Status: Engine Array Failed";
                return;
            }

            const selectedEngine = ENGINES[engineAttemptIndex];
            diagnosticsDiv.textContent = `Routing via: ${selectedEngine}...`;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: selectedEngine,
                        messages: [
                            { role: "system", content: appState.systemPrompt + (appState.globalMemory ? `\n[Persistent Context: ${appState.globalMemory}]` : "") },
                            { role: "user", content: prompt }
                        ]
                    })
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const data = await response.json();
                const replyText = data.choices[0]?.message?.content || "No output vector returned.";
                
                contentDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(replyText) : replyText;
                diagnosticsDiv.textContent = `Rendered by: ${selectedEngine}`;
                
                const currentChat = appState.chats[appState.currentChatId];
                currentChat.messages[msgIndex].variants[0] = replyText;
                saveState();

            } catch (err) {
                console.warn(`Engine ${selectedEngine} failed. Tripping fallback loop...`, err);
                await executeEngineStream(prompt, wrapper, msgIndex, engineAttemptIndex + 1);
            }
        }

        function executeImageSynthesis(promptText, parentIndex) {
            const aiMsgIndex = appState.chats[appState.currentChatId].messages.length;
            const encodedPrompt = encodeURIComponent(promptText);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?nologo=true`;
            
            const imageMarkdown = `![Generated Image](${imageUrl})\n\n*Prompt: "${promptText}"*`;
            const newAiMessage = { role: 'assistant', variants: [imageMarkdown], activeIndex: 0 };
            
            appState.chats[appState.currentChatId].messages.push(newAiMessage);
            const wrapper = renderMessageWrapperHTML(newAiMessage, aiMsgIndex);
            
            const imgEl = wrapper.querySelector('img');
            if (imgEl) {
                imgEl.className = 'gen-image';
                const imgContainer = document.createElement('div');
                imgContainer.className = 'gen-image-wrapper';
                imgEl.parentNode.insertBefore(imgContainer, imgEl);
                imgContainer.appendChild(imgEl);
                
                imgEl.onload = () => imgEl.classList.add('loaded');
            }
            saveState();
        }

        function handleFileUpload(files) {
            if (!files.length) return;
            const file = files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                appState.globalMemory += `\n[Ingested File (${file.name}): ${text}]`;
                document.getElementById('memory-files-list').innerHTML += `<div>📄 Loaded: ${file.name}</div>`;
                saveState();
            };
            reader.readAsText(file);
        }

        function setupFileIngest() {
            const dropZone = document.getElementById('drop-zone');
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(88,166,255,0.1)'; });
            dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.background = 'rgba(0,0,0,0.2)'; });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.background = 'rgba(0,0,0,0.2)';
                handleFileUpload(e.dataTransfer.files);
            });
        }
    </script>
</body>
</html>
