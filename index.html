<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Workspace V10.0 Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            user-select: auto;
            -webkit-user-select: auto;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        :root {
            --bg-body: #0b0f19;
            --bg-sidebar: #111827;
            --bg-header: #151b26;
            --border-color: #2d3748;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --bg-chat: #0b0f19;
            --bg-input-panel: #151b26;
            --bg-input: #0f172a;
            --msg-user: #2563eb;
            --msg-user-text: #ffffff;
            --msg-ai: #1e293b;
            --msg-ai-text: #f1f5f9;
            --msg-ai-border: rgba(255, 255, 255, 0.05);
            --accent: #3b82f6;
        }

        [data-theme="light"] {
            --bg-body: #ffffff;
            --bg-sidebar: #f3f4f6;
            --bg-header: #f8f9fa;
            --border-color: #dadce0;
            --text-main: #202124;
            --text-sub: #5f6368;
            --bg-chat: #ffffff;
            --bg-input-panel: #f8f9fa;
            --bg-input: #ffffff;
            --msg-user: #1a73e8;
            --msg-user-text: #ffffff;
            --msg-ai: #f1f3f4;
            --msg-ai-text: #202124;
            --msg-ai-border: transparent;
            --accent: #1a73e8;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            overflow: hidden;
            touch-action: manipulation;
        }

        #sidebar {
            width: 280px;
            height: 100%;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .new-chat-btn {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .chat-history-item:hover, .chat-history-item.active {
            background-color: var(--bg-input-panel);
            color: var(--text-main);
        }

        #main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        header {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .menu-btn { background: transparent; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; display: none; }
        header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
        .header-right { display: flex; gap: 8px; }

        #theme-toggle, #system-prompt-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }

        #chat-container {
            flex: 1;
            width: 100%;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            position: relative;
        }
        .message-wrapper.user-wrapper { align-self: flex-end; }
        .message-wrapper.ai-wrapper { align-self: flex-start; }

        .message { 
            width: 100%;
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 15px; 
            line-height: 1.5; 
            word-wrap: break-word; 
            cursor: pointer;
            position: relative;
            transition: transform 0.15s ease, background-color 0.3s ease;
        }

        .message-content { user-select: text; -webkit-user-select: text; }
        .user-msg { background-color: var(--msg-user); color: var(--msg-user-text); border-bottom-right-radius: 4px; }
        .ai-msg { background-color: var(--msg-ai); color: var(--msg-ai-text); border-bottom-left-radius: 4px; border: 1px solid var(--msg-ai-border); }

        .diagnostic-tag {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 4px;
            padding-left: 6px;
            opacity: 0.75;
            font-family: monospace;
        }

        .msg-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 12px;
            z-index: 2000;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            animation: popUp 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .msg-menu button, .msg-menu select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: 600;
            outline: none;
        }

        .msg-menu select option {
            background: #1e293b;
            color: white;
        }

        @keyframes popUp {
            from { transform: scale(0.8) translateY(5px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        #reply-dock {
            display: none;
            background: var(--bg-header);
            border-top: 1px solid var(--border-color);
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-sub);
            justify-content: space-between;
            align-items: center;
        }
        #reply-dock.active { display: flex; }

        #sidebar-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        #settings-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            z-index: 2000;
            width: 92%;
            max-width: 420px;
        }

        #settings-modal textarea {
            width: 100%;
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-family: inherit;
            resize: none;
            font-size: 13px;
        }

        #input-panel-container { display: flex; flex-direction: column; background: var(--bg-input-panel); border-top: 1px solid var(--border-color); }
        #input-panel { padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
        #user-input { flex: 1; background-color: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; }
        #send-btn { background-color: var(--accent); color: #ffffff; border: none; padding: 12px 20px; border-radius: 24px; font-weight: 600; cursor: pointer; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; left: 0; transform: translateX(-100%); height: 100%; }
            #sidebar.open { transform: translateX(0); }
            #sidebar-overlay.show { display: block; }
            .menu-btn { display: block; }
        }
    </style>
</head>
<body data-theme="dark" onclick="closeAllMenus()">

    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    
    <div id="sidebar">
        <div class="sidebar-header">
            <h3>CHATS</h3>
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="sidebar-content">
            <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            <div id="chats-list"></div>
        </div>
    </div>

    <div id="main-workspace">
        <header>
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar(event)">☰</button>
                <h1>WORKSPACE V10</h1>
            </div>
            <div class="header-right">
                <button id="system-prompt-toggle" onclick="toggleSettings(event)">🧠 BRAIN</button>
                <button id="theme-toggle" onclick="toggleTheme()">☀️ LIGHT</button>
            </div>
        </header>

        <div id="chat-container"></div>

        <div id="input-panel-container">
            <div id="reply-dock">
                <span id="reply-preview-text">Replying to message...</span>
                <button onclick="clearReplyDock()" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;">✕</button>
            </div>
            <div id="input-panel">
                <input type="text" id="user-input" placeholder="Type your prompt..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" onclick="event.stopPropagation()">
        <h3>Core Configuration</h3>
        <label>SYSTEM PROMPT</label>
        <textarea id="system-prompt-input" rows="3"></textarea>
        <label>GLOBAL MEMORY</label>
        <textarea id="global-memory-input" rows="3"></textarea>
        <button class="new-chat-btn" onclick="saveSettings()" style="margin-top:10px;">Save Configuration</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const themeToggle = document.getElementById('theme-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const chatsList = document.getElementById('chats-list');
        const settingsModal = document.getElementById('settings-modal');

        const API_KEY = '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';
        
        // Priority ENGINES Array
        const ENGINES = [
            'cognitivecomputations/dolphin-mistral-24b-venice-edition:free',
            'cognitivecomputations/dolphin-2.2.1-mistral-7b:free',
            'gryphe/mythomax-l2-13b:free',
            'gryphe/mythomax-l2-13b',
            'openrouter/free',
            'google/gemini-2.0-flash-lite-001:free',
            'meta-llama/llama-3.3-70b-instruct:free',
            'qwen/qwen-2.5-coder-32b-instruct:free',
            'mistralai/mistral-7b-instruct:free'
        ];

        let appState = {
            theme: 'dark',
            chats: {},
            currentChatId: null,
            systemPrompt: "You are a direct, powerful AI assistant.",
            globalMemory: ""
        };

        window.onload = () => {
            loadState();
            userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        };

        function loadState() {
            const saved = localStorage.getItem('ai_workspace_v10');
            if (saved) {
                appState = JSON.parse(saved);
                document.body.setAttribute('data-theme', appState.theme || 'dark');
            } else {
                createNewChat();
            }
            document.getElementById('system-prompt-input').value = appState.systemPrompt || "";
            document.getElementById('global-memory-input').value = appState.globalMemory || "";
            renderChatsList();
            if (appState.currentChatId) loadChat(appState.currentChatId);
        }

        function saveState() {
            localStorage.setItem('ai_workspace_v10', JSON.stringify(appState));
        }

        function toggleTheme() {
            appState.theme = appState.theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', appState.theme);
            themeToggle.textContent = appState.theme === 'dark' ? '☀️ LIGHT' : '🌙 DARK';
            saveState();
        }

        function toggleSidebar(e) {
            if (e) e.stopPropagation();
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function toggleSettings(e) {
            if (e) e.stopPropagation();
            settingsModal.style.display = settingsModal.style.display === 'block' ? 'none' : 'block';
        }

        function saveSettings() {
            appState.systemPrompt = document.getElementById('system-prompt-input').value;
            appState.globalMemory = document.getElementById('global-memory-input').value;
            saveState();
            settingsModal.style.display = 'none';
        }

        function createNewChat() {
            const id = 'chat_' + Date.now();
            appState.chats[id] = {
                name: 'New Session',
                messages: [{ role: 'assistant', variants: ['AI Engine online.'], activeIndex: 0, engine: 'system' }]
            };
            appState.currentChatId = id;
            saveState();
            renderChatsList();
            loadChat(id);
        }

        function loadChat(id) {
            appState.currentChatId = id;
            chatContainer.innerHTML = '';
            const activeChat = appState.chats[id];
            if (activeChat && activeChat.messages) {
                activeChat.messages.forEach((msg, index) => renderMessageWrapperHTML(msg, index));
            }
            renderChatsList();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderChatsList() {
            chatsList.innerHTML = '';
            for (let id in appState.chats) {
                const item = document.createElement('div');
                item.className = `chat-history-item ${id === appState.currentChatId ? 'active' : ''}`;
                item.innerHTML = `<span>${appState.chats[id].name}</span>`;
                item.onclick = () => loadChat(id);
                chatsList.appendChild(item);
            }
        }

        function renderMessageWrapperHTML(msg, index) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${msg.role === 'user' ? 'user-wrapper' : 'ai-wrapper'}`;
            wrapper.dataset.index = index;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.role === 'user' ? 'user-msg' : 'ai-msg'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            const activeText = msg.variants ? msg.variants[msg.activeIndex || 0] : msg.content || '';
            contentDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(activeText) : activeText;

            msgDiv.appendChild(contentDiv);
            wrapper.appendChild(msgDiv);

            const diagDiv = document.createElement('div');
            diagDiv.className = 'diagnostic-tag';
            diagDiv.textContent = msg.engine ? `Engine: ${msg.engine}` : '';
            wrapper.appendChild(diagDiv);

            msgDiv.onclick = (e) => {
                e.stopPropagation();
                closeAllMenus();
                showMsgMenu(msgDiv, activeText, index, msg.role);
            };

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return wrapper;
        }

        function showMsgMenu(targetEl, text, msgIndex, role) {
            const menu = document.createElement('div');
            menu.className = 'msg-menu';
            
            const copyBtn = document.createElement('button');
            copyBtn.textContent = 'Copy';
            copyBtn.onclick = () => { navigator.clipboard.writeText(text); closeAllMenus(); };

            menu.appendChild(copyBtn);

            // Manual Engine Selector for Assistant Messages
            if (role === 'assistant' && msgIndex > 0) {
                const select = document.createElement('select');
                ENGINES.forEach(eng => {
                    const opt = document.createElement('option');
                    opt.value = eng;
                    opt.textContent = eng.split('/')[1] || eng;
                    select.appendChild(opt);
                });

                const reGenBtn = document.createElement('button');
                reGenBtn.textContent = 'Re-Run';
                reGenBtn.onclick = () => {
                    const selectedEngine = select.value;
                    closeAllMenus();
                    regenerateMessageWithEngine(msgIndex, selectedEngine);
                };

                menu.appendChild(select);
                menu.appendChild(reGenBtn);
            }

            targetEl.appendChild(menu);
        }

        function closeAllMenus() {
            document.querySelectorAll('.msg-menu').forEach(m => m.remove());
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const currentChat = appState.chats[appState.currentChatId];
            if (currentChat.messages.length === 1 && currentChat.name === 'New Session') {
                currentChat.name = text.substring(0, 20) + '...';
                renderChatsList();
            }

            const userMsgIndex = currentChat.messages.length;
            currentChat.messages.push({ role: 'user', variants: [text], activeIndex: 0 });
            renderMessageWrapperHTML(currentChat.messages[userMsgIndex], userMsgIndex);
            userInput.value = '';

            const aiMsgIndex = currentChat.messages.length;
            const newAiMessage = { role: 'assistant', variants: ['Thinking...'], activeIndex: 0, engine: 'Connecting...' };
            currentChat.messages.push(newAiMessage);
            const wrapper = renderMessageWrapperHTML(newAiMessage, aiMsgIndex);
            
            await executeEngineStream(text, wrapper, aiMsgIndex);
        }

        async function regenerateMessageWithEngine(aiMsgIndex, targetEngine) {
            const currentChat = appState.chats[appState.currentChatId];
            const previousUserPrompt = currentChat.messages[aiMsgIndex - 1]?.variants[0] || "";

            const wrappers = chatContainer.querySelectorAll('.message-wrapper');
            const targetWrapper = wrappers[aiMsgIndex];
            
            if (!targetWrapper) return;

            const contentDiv = targetWrapper.querySelector('.message-content');
            const diagnosticsDiv = targetWrapper.querySelector('.diagnostic-tag');

            contentDiv.textContent = `Regenerating with ${targetEngine}...`;
            diagnosticsDiv.textContent = `Engine Active: ${targetEngine}`;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "http://localhost",
                        "X-Title": "AI Workspace"
                    },
                    body: JSON.stringify({
                        model: targetEngine,
                        messages: [
                            { role: "system", content: appState.systemPrompt + (appState.globalMemory ? `\n[Context: ${appState.globalMemory}]` : "") },
                            { role: "user", content: previousUserPrompt }
                        ]
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const replyText = data.choices[0]?.message?.content || "No output.";
                
                contentDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(replyText) : replyText;
                diagnosticsDiv.textContent = `Engine: ${targetEngine}`;
                
                currentChat.messages[aiMsgIndex].variants[0] = replyText;
                currentChat.messages[aiMsgIndex].engine = targetEngine;
                saveState();

            } catch (err) {
                contentDiv.textContent = `Error calling ${targetEngine}: ${err.message}`;
                diagnosticsDiv.textContent = `Engine Failed: ${targetEngine}`;
            }
        }

        async function executeEngineStream(prompt, wrapper, msgIndex) {
            const contentDiv = wrapper.querySelector('.message-content');
            const diagnosticsDiv = wrapper.querySelector('.diagnostic-tag');

            for (let i = 0; i < ENGINES.length; i++) {
                const currentEngine = ENGINES[i];
                diagnosticsDiv.textContent = `Trying [${i + 1}/${ENGINES.length}]: ${currentEngine}...`;

                try {
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${API_KEY}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": "http://localhost",
                            "X-Title": "AI Workspace"
                        },
                        body: JSON.stringify({
                            model: currentEngine,
                            messages: [
                                { role: "system", content: appState.systemPrompt + (appState.globalMemory ? `\n[Context: ${appState.globalMemory}]` : "") },
                                { role: "user", content: prompt }
                            ]
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

                    const data = await response.json();
                    const replyText = data.choices[0]?.message?.content || "No output returned.";
                    
                    contentDiv.innerHTML = typeof marked !== 'undefined' ? marked.parse(replyText) : replyText;
                    diagnosticsDiv.textContent = `Engine: ${currentEngine}`;
                    
                    const currentChat = appState.chats[appState.currentChatId];
                    currentChat.messages[msgIndex].variants[0] = replyText;
                    currentChat.messages[msgIndex].engine = currentEngine;
                    saveState();
                    return;

                } catch (err) {
                    console.warn(`Engine ${currentEngine} failed:`, err);
                }
            }

            contentDiv.textContent = "Error: All selected AI engines are currently unavailable.";
            diagnosticsDiv.textContent = "Status: All Engines Failed";
        }
    </script>
</body>
</html>
